id: chips.basecard.hyperlink
name: 超链接基础卡片插件
version: 0.1.0
type: card
entry: dist/index.mjs
description: 超链接基础卡片插件，用于在复合卡片中插入可点击的新页面跳转链接。
author:
  name: sevenstars
  email: dev@chips.local
capabilities:
  cardTypes:
    - base.hyperlink
permissions:
  - platform.external
runtime:
  targets:
    desktop:
      supported: true
    web:
      supported: false
    mobile:
      supported: false
    headless:
      supported: true
engines:
  chips: "^0.1.0"
os:
  - darwin
  - win32
  - linux
