<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>网格布局 · 编辑面板设计原型 v3</title>
<style>
  :root {
    --accent: #2563eb;
    --danger: #dc2626;
    --on-surface: #111111;
    --muted: #6b7280;
    --surface: #ffffff;
    --group-bg: #ffffff;
    --page-bg: #f2f2f7;
    --border: #e5e5ea;
    --hover: #f5f5f7;
    --radius: 12px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font);
    color: var(--on-surface);
    background:
      radial-gradient(900px 500px at 15% -10%, #eef2ff 0%, transparent 60%),
      radial-gradient(800px 400px at 95% 110%, #f0fdf4 0%, transparent 55%),
      #f5f6f8;
    display: flex;
    justify-content: center;
    padding: 36px 16px 64px;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  .page { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
  .page-head { text-align: center; }
  .page-head .tag {
    display: inline-block; margin-bottom: 8px; padding: 3px 10px;
    font-size: 11px; font-weight: 600; color: var(--accent);
    background: #eef2ff; border: 1px solid #dbe3ff; border-radius: 999px;
  }
  .page-head h1 { margin: 0; font-size: 20px; letter-spacing: 0.3px; }

  /* ============ 面板 ============ */
  .panel {
    width: 372px; max-width: 100%;
    background: var(--page-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 14px 44px rgba(17, 24, 39, 0.1);
    overflow: hidden;
  }
  .panel__frame { display: flex; flex-direction: column; height: 660px; }

  .panel__tabs {
    display: flex; padding: 0 12px;
    background: #fafbfc; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .panel__tab { position: relative; padding: 11px 12px; font-size: 13px; color: var(--muted); cursor: default; }
  .panel__tab--active { color: var(--on-surface); font-weight: 600; }
  .panel__tab--active::after {
    content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px;
    height: 2px; border-radius: 2px; background: var(--accent);
  }

  /* ============ 编辑器 ============ */
  .editor { flex: 1; overflow-y: auto; }
  .editor__scroll { padding: 12px 12px 28px; }

  .head { display: flex; align-items: center; gap: 10px; padding: 8px 6px 14px; }
  .head__icon {
    width: 34px; height: 34px; flex-shrink: 0; display: grid; place-items: center;
    border-radius: 9px; background: #eef2ff; color: var(--accent);
  }
  .head__title { font-size: 15px; font-weight: 700; margin: 0; }
  .head__count { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); }

  /* 分组 */
  .group { background: var(--group-bg); border-radius: var(--radius); overflow: hidden; }
  .group + .group { margin-top: 16px; }

  .row {
    position: relative;
    display: flex; align-items: center; gap: 10px;
    min-height: 44px; padding: 0 14px;
  }
  .row + .row::before {
    content: ""; position: absolute; top: 0; left: 14px; right: 0;
    height: 1px; background: var(--border);
  }
  .row__label { flex: 1; min-width: 0; font-size: 14px; }
  .row__value { font-size: 14px; color: var(--muted); }
  .row__chevron { width: 12px; height: 12px; flex-shrink: 0; color: #c7c7cc; transform: rotate(90deg); }
  .row--link { cursor: pointer; }
  .row--link:hover { background: var(--hover); }

  /* 行内分段控件 */
  .segmented {
    display: flex; padding: 2px; gap: 2px;
    background: #f2f2f7; border-radius: 9px; flex-shrink: 0;
  }
  .segmented__item {
    padding: 5px 10px; font-size: 12px; color: var(--muted);
    background: none; border: none; border-radius: 7px; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .segmented__item--active {
    background: var(--surface); color: var(--on-surface); font-weight: 600;
    box-shadow: 0 1px 3px rgba(17,24,39,0.14);
  }

  /* 图片模式 · 有图状态：缩略图 + 操作 */
  .row--media { gap: 12px; min-height: 52px; }
  .media__thumb {
    width: 44px; height: 28px; flex-shrink: 0;
    border-radius: 6px; overflow: hidden; background: #f2f2f7;
    border: 1px solid var(--border);
  }
  .media__thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .media__action { font-size: 14px; color: var(--accent); cursor: pointer; }
  .media__action--destructive { color: var(--danger); }

  /* 图片模式 · 无图状态：拖放上传框 */
  .drop-zone {
    display: grid; place-items: center;
    margin: 10px 14px 12px; min-height: 96px;
    border: 1.5px dashed #c7c7cc; border-radius: 10px;
    color: var(--muted); font-size: 13px; text-align: center;
    cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .drop-zone svg { width: 22px; height: 22px; margin-bottom: 6px; color: #9ca3af; transition: color 0.15s ease; }
  .drop-zone:hover { border-color: var(--accent); background: #f5f7ff; color: var(--accent); }
  .drop-zone:hover svg { color: var(--accent); }
  .drop-zone--dragover { border-color: var(--accent); border-style: solid; background: #eef2ff; color: var(--accent); }
  .drop-zone--dragover svg { color: var(--accent); }
  /* 有图状态：同一框内铺图 */
  .drop-zone--filled {
    border-style: solid; border-color: var(--border);
    padding: 0; overflow: hidden; position: relative;
    aspect-ratio: 16 / 5; min-height: 0; width: calc(100% - 28px); margin-left: 14px; margin-right: 14px;
  }
  .drop-zone--filled img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .drop-zone__overlay {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(17, 24, 39, 0.45); color: #ffffff; font-size: 13px; font-weight: 600;
    opacity: 0; transition: opacity 0.15s ease;
  }
  .drop-zone--filled:hover .drop-zone__overlay { opacity: 1; }
  .media__remove-row {
    display: flex; justify-content: flex-end;
    padding: 6px 14px 10px;
  }

  /* 代码模式 */
  .row--code { padding: 10px 14px; align-items: flex-start; flex-direction: column; }
  .code-area {
    width: 100%; min-height: 64px; padding: 8px 10px;
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5;
    color: var(--on-surface); background: #fbfbfc;
    border: 1px solid var(--border); border-radius: 8px; resize: vertical;
  }
  .code-area:focus { outline: none; border-color: var(--accent); }

  /* 排序选择菜单 */
  .menu {
    position: absolute; top: calc(100% + 6px); left: 14px; right: 14px; z-index: 30;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: 0 10px 34px rgba(17,24,39,0.16); padding: 4px; display: none;
  }
  .row--link.open .menu { display: block; }
  .menu__item { padding: 10px 12px; font-size: 14px; border-radius: 8px; cursor: pointer; }
  .menu__item:hover { background: #f2f2f7; }
  .menu__item--selected { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
  <div class="page">
    <div class="page-head">
      <span class="tag">设计原型 · v3</span>
      <h1>网格布局 · 编辑面板</h1>
    </div>

    <div class="panel">
      <div class="panel__frame">
        <div class="panel__tabs">
          <span class="panel__tab panel__tab--active">配置</span>
          <span class="panel__tab">内容列表</span>
        </div>

        <div class="editor">
          <div class="editor__scroll">

            <!-- 面板头 -->
            <div class="head">
              <div class="head__icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/>
                  <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/>
                </svg>
              </div>
              <p class="head__title">网格布局</p>
              <span class="head__count">24 个条目</span>
            </div>

            <!-- 组 1：排序 -->
            <div class="group">
              <div class="row row--link" data-sort-row>
                <span class="row__label">排序方式</span>
                <span class="row__value" data-sort-value>手动顺序</span>
                <svg class="row__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
                <div class="menu">
                  <div class="menu__item menu__item--selected" data-sort="手动顺序">手动顺序</div>
                  <div class="menu__item" data-sort="按名称升序">按名称升序</div>
                  <div class="menu__item" data-sort="按名称降序">按名称降序</div>
                </div>
              </div>
            </div>

            <!-- 组 2：顶部区域（有图状态） -->
            <div class="group">
              <div class="row">
                <span class="row__label">顶部区域</span>
                <div class="segmented" data-segmented="topRegion">
                  <button type="button" class="segmented__item" data-mode="none">不显示</button>
                  <button type="button" class="segmented__item segmented__item--active" data-mode="image">图片</button>
                  <button type="button" class="segmented__item" data-mode="html">代码</button>
                </div>
              </div>
              <div data-mode-row="topRegion:image">
                <div class="drop-zone drop-zone--filled" data-drop-zone-filled role="button" tabindex="0">
                  <img src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='320' height='100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b82f6'/%3E%3Cstop offset='0.55' stop-color='%232563eb'/%3E%3Cstop offset='1' stop-color='%231e40af'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='320' height='100' fill='url(%23g)'/%3E%3C/svg%3E" alt="顶部区域图片" />
                  <div class="drop-zone__overlay">点击或拖拽图片替换</div>
                </div>
                <div class="drop-zone" style="display:none" role="button" tabindex="0">
                  <div>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                      <path d="m17 8-5-5-5 5"/>
                      <path d="M12 3v12"/>
                    </svg>
                    <div>点击选择图片，或拖拽图片到此处</div>
                  </div>
                </div>
                <div class="media__remove-row">
                  <span class="media__action media__action--destructive" data-remove-image="topRegion">移除</span>
                </div>
              </div>
              <div class="row row--code" data-mode-row="topRegion:html" style="display:none">
                <textarea class="code-area" spellcheck="false" placeholder="&lt;section&gt;…&lt;/section&gt;">&lt;section class="hero"&gt;&lt;h1&gt;我的摄影集&lt;/h1&gt;&lt;/section&gt;</textarea>
                <span class="media__action media__action--destructive" data-clear-code>清空</span>
              </div>
            </div>

            <!-- 组 3：背景区域（无图状态 → 拖放上传框） -->
            <div class="group">
              <div class="row">
                <span class="row__label">背景区域</span>
                <div class="segmented" data-segmented="background">
                  <button type="button" class="segmented__item segmented__item--active" data-mode="none">不显示</button>
                  <button type="button" class="segmented__item" data-mode="image">图片</button>
                  <button type="button" class="segmented__item" data-mode="html">代码</button>
                </div>
              </div>
              <div data-mode-row="background:image" style="display:none">
                <div class="drop-zone" data-drop-zone role="button" tabindex="0">
                  <div>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                      <path d="m17 8-5-5-5 5"/>
                      <path d="M12 3v12"/>
                    </svg>
                    <div>点击选择图片，或拖拽图片到此处</div>
                  </div>
                </div>
              </div>
              <div class="row row--code" data-mode-row="background:html" style="display:none">
                <textarea class="code-area" spellcheck="false" placeholder="&lt;section&gt;…&lt;/section&gt;"></textarea>
                <span class="media__action media__action--destructive" data-clear-code>清空</span>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>

    <p style="font-size:11px;color:#9ca3af;text-align:center;max-width:420px;line-height:1.7">
      图片模式分两种状态：无图时显示虚线拖放框（点击 / 拖拽均可上传），有图时显示缩略图 + 替换 / 移除。
    </p>
  </div>

<script>
(function () {
  var sortRow = document.querySelector('[data-sort-row]');
  var sortValue = document.querySelector('[data-sort-value]');
  sortRow.addEventListener('click', function (e) {
    var item = e.target.closest('[data-sort]');
    if (item) {
      sortValue.textContent = item.textContent;
      sortRow.querySelectorAll('[data-sort]').forEach(function (o) {
        o.classList.toggle('menu__item--selected', o === item);
      });
      sortRow.classList.remove('open');
      return;
    }
    sortRow.classList.toggle('open');
  });
  document.addEventListener('click', function (e) {
    if (!sortRow.contains(e.target)) sortRow.classList.remove('open');
  });

  document.querySelectorAll('[data-segmented]').forEach(function (seg) {
    seg.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-mode]');
      if (!btn) return;
      var group = seg.dataset.segmented;
      seg.querySelectorAll('[data-mode]').forEach(function (b) {
        b.classList.toggle('segmented__item--active', b === btn);
      });
      var mode = btn.dataset.mode;
      ['none', 'image', 'html'].forEach(function (m) {
        var row = document.querySelector('[data-mode-row="' + group + ':' + m + '"]');
        if (row) row.style.display = (m === mode) ? '' : 'none';
      });
    });
  });

  document.querySelectorAll('[data-clear-code]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var row = btn.closest('[data-mode-row]');
      var area = row.querySelector('.code-area');
      if (area) area.value = '';
    });
  });

  // 拖放框：拖入高亮演示
  document.querySelectorAll('[data-drop-zone], [data-drop-zone-filled]').forEach(function (zone) {
    ['dragenter', 'dragover'].forEach(function (ev) {
      zone.addEventListener(ev, function (e) { e.preventDefault(); zone.classList.add('drop-zone--dragover'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      zone.addEventListener(ev, function (e) { e.preventDefault(); zone.classList.remove('drop-zone--dragover'); });
    });
  });

  // 移除图片：有图框 → 无图虚线框（演示）
  document.querySelectorAll('[data-remove-image]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var group = btn.dataset.removeImage;
      var row = document.querySelector('[data-mode-row="' + group + ':image"]');
      var filled = row.querySelector('.drop-zone--filled');
      var empty = row.querySelector('.drop-zone:not(.drop-zone--filled)');
      var removeRow = row.querySelector('.media__remove-row');
      if (filled) filled.style.display = 'none';
      if (removeRow) removeRow.style.display = 'none';
      if (empty) empty.style.display = '';
    });
  });
})();
</script>
</body>
</html>
