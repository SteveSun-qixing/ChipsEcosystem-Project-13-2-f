id: chips.module.chips.community-uploader
name: Chips Community Uploader
version: 0.1.0
type: module
entry: dist/index.mjs
description: 在用户设备上处理 .card 上传、网络资源卡片生成、远程打开和完整卡片下载恢复的官方社区卡片传输模块。
author:
  name: sevenstars
  email: chips-community-uploader@example.invalid
permissions:
  - box.read
  - box.write
  - card.read
  - card.write
  - file.read
  - file.write
  - network.request
  - platform.external
  - plugin.manage
  - window.control
  - zip.manage
runtime:
  targets:
    desktop:
      supported: true
    web:
      supported: false
    mobile:
      supported: true
    headless:
      supported: true
engines:
  chips: "^0.1.0"
os:
  - darwin
  - win32
  - linux
module:
  apiVersion: 1
  runtime: worker
  activation: onDemand
  provides:
    - capability: community.card.transfer
      version: "1.0.0"
      methods:
        - name: upload
          mode: job
          inputSchema: contracts/upload.input.schema.json
          outputSchema: contracts/upload.output.schema.json
        - name: download
          mode: job
          inputSchema: contracts/download.input.schema.json
          outputSchema: contracts/download.output.schema.json
        - name: openRemote
          mode: job
          inputSchema: contracts/openRemote.input.schema.json
          outputSchema: contracts/openRemote.output.schema.json
        - name: openRemoteBox
          mode: job
          inputSchema: contracts/openRemoteBox.input.schema.json
          outputSchema: contracts/openRemoteBox.output.schema.json
        - name: uploadBox
          mode: job
          inputSchema: contracts/uploadBox.input.schema.json
          outputSchema: contracts/uploadBox.output.schema.json
  consumes: []
