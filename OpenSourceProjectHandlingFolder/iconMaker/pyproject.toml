[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icon-maker"
version = "0.1.0"
description = "A tool to convert SVG/PNG to PNG, ICO, and ICNS icons with white background"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "Pillow>=10.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
svg = ["cairosvg>=2.7.0"]
gui = ["tkinterdnd2>=0.3.0"]

[project.scripts]
icon-maker = "icon_maker.cli:main"
icon-maker-gui = "icon_maker.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
